name: Update PNCP candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * 1'
permissions:
  contents: write
concurrency:
  group: pncp-collection
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/collect_pncp.py
      - name: Verify candidates
        run: |
          python -c "import json; d=json.load(open('public/data/contratos.json')); assert d['orgaoCnpj']=='88577416000118'; assert all(c['url_fonte'].startswith('https://') for c in d['items'])"
      - name: Commit verified collection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/contratos.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh PNCP contract candidates"
            git push
          fi
