name: Refresh SICONFI municipal investment data
on:
  push:
    branches: [main]
    paths:
      - scripts/collect_siconfi.py
      - .github/workflows/refresh-siconfi.yml
  workflow_dispatch:
  schedule:
    - cron: '10 10 6 * *'
permissions:
  contents: write
concurrency:
  group: siconfi-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/collect_siconfi.py
      - name: Check output schema
        run: |
          python -c "import json; d=json.load(open('public/data/financas.json')); assert all(x['abrangencia']=='municipal' and x['fonte'].startswith('https://') for x in d['observacoes'])"
      - name: Publish verified SICONFI statements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/financas.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh municipal RREO investment observations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
