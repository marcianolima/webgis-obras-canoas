name: Diagnose official Obrasgov API
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_obrasgov.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probe_obrasgov.py
