name: Georreferenciar contratos PNCP com referências verificáveis
on:
  push:
    branches: [main]
    paths:
      - scripts/georreferenciar_pncp.py
      - .github/workflows/refresh-geocoding.yml
      - public/data/equipamentos-referencia.geojson
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pncp-geocoding
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/georreferenciar_pncp.py
      - name: Publicar georreferenciamento auditado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/intervencoes.geojson public/data/geocodificacao-pendencias.json
          if ! git diff --cached --quiet; then
            git commit -m "data: georreferenciar contratos por equipamentos CNES e SEDUC"
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" -eq 4 ]; then exit 1; fi
              sleep $((i*3))
            done
          fi
