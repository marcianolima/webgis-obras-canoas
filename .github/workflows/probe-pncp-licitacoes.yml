name: Probe PNCP procurement
on:
  push:
    paths:
      - scripts/probe_pncp_licitacoes.py
      - .github/workflows/probe-pncp-licitacoes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_pncp_licitacoes.py
